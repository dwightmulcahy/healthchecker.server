name: Unit tests and coverage

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e . pytest pytest-cov pytest-timeout
      - name: Enforce 90 percent repository-wide branch coverage
        run: |
          python -m pytest -vv tests --timeout=10 --timeout-method=thread --cov --cov-config=.coveragerc \
            --cov-branch --cov-report=term-missing:skip-covered \
            --cov-report=xml:coverage.xml --cov-fail-under=90
      - name: Upload XML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-coverage
          path: coverage.xml
          if-no-files-found: ignore

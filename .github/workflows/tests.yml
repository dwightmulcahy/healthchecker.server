name: Unit tests and coverage

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest pytest-cov requests
      - name: Test network utilities with branch coverage
        run: >-
          python -m pytest -q tests
          --cov=iputils
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90
      - name: Verify registration validation branch coverage
        run: >-
          python -m pytest -q tests/test_monitor_validation.py
          --cov=monitor_validation
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90
      - name: Verify SQLite persistence branch coverage
        run: >-
          python -m pytest -q tests/test_monitor_store.py
          --cov=monitor_store
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90
      - name: Verify interactive status page coverage
        run: >-
          python -m pytest -q tests/test_status_page.py
          --cov=status_page
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90
